name: branch-flow

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  allowed-branch-flow:
    name: allowed-branch-flow
    runs-on: ubuntu-latest
    steps:
      - name: Check allowed source branch
        env:
          BASE_REPO: ${{ github.repository }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_USER: ${{ github.event.pull_request.head.user.login }}
        run: |
          allowed=false
          if [ "$HEAD_REPO" = "$BASE_REPO" ]; then
            if [ "$BASE_REF" = "main" ] && [ "$HEAD_REF" = "develop" ]; then
              allowed=true
            elif [ "$BASE_REF" = "develop" ] && [[ "$HEAD_REF" =~ ^([^/]+)/(feat|fix|chore|docs|test|refactor|build|ci)/([a-z0-9]+(-[a-z0-9]+)*)$ ]]; then
              branch_user=${BASH_REMATCH[1]}
              normalized_branch_user=$(printf '%s' "$branch_user" | tr '[:upper:]' '[:lower:]')
              normalized_head_user=$(printf '%s' "$HEAD_USER" | tr '[:upper:]' '[:lower:]')
              if [ "$normalized_branch_user" = "$normalized_head_user" ]; then
                allowed=true
              fi
            fi
          fi

          if [ "$allowed" != true ]; then
            echo "PR source $HEAD_REPO:$HEAD_REF is not allowed for $BASE_REF"
            exit 1
          fi
