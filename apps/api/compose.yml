name: qanda-sync-v1
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: qanda_sync
      POSTGRES_USER: qanda_sync
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["sync_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qanda_sync"]
      interval: 2s
      timeout: 2s
      retries: 30
  rabbitmq:
    image: rabbitmq:4.1.4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: qanda_sync
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD:?set RABBIT_PASSWORD}
    ports: ["127.0.0.1:55672:5672", "127.0.0.1:55673:15672"]
    volumes: ["sync_rabbit:/var/lib/rabbitmq"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  sync_pg:
  sync_rabbit:
